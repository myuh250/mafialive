services:
  web:
    image: mafialive-web
    build: .
    ports:
      - "8081:80"
    environment:
      XF_DB_HOST: db
      XF_DB_PORT: "3306"
      XF_DB_USER: mafialiv1
      XF_DB_PASSWORD: kS6eIYnSlKArdFy
      XF_DB_NAME: mafialiv_forum
      XF_URL_PREFIX: /proxy/8081
    depends_on:
      - db

  db:
    image: mariadb:10.6
    environment:
      MARIADB_DATABASE: mafialiv_forum
      MARIADB_USER: mafialiv1
      MARIADB_PASSWORD: kS6eIYnSlKArdFy
      MARIADB_ROOT_PASSWORD: mafialive
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./mafialiv_forum_database.zip:/dump/mafialiv_forum_database.zip:ro
      - ./docker/01-import-dump.sh:/docker-entrypoint-initdb.d/01-import-dump.sh:ro

volumes:
  db_data:
